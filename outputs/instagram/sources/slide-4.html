<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<link rel="stylesheet" href="base.css">
<style>
.mock {
  margin-top: 62px;
  width: 820px;
  height: 560px;
  align-self: center;
  padding: 64px 70px;
  display: flex;
  gap: 56px;
  align-items: center;
}
.gift .name {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 600;
  font-size: 50px;
  color: var(--plum);
  line-height: 1.1;
}
.gift .price { margin-top: 18px; font-size: 34px; font-weight: 600; color: var(--cocoa); }
.gift .btn {
  margin-top: 38px;
  display: inline-block;
  background: var(--plum);
  color: var(--ivory);
  border-radius: 999px;
  padding: 24px 40px;
  font-size: 26px;
  font-weight: 600;
}
.gift .note { margin-top: 30px; font-size: 24px; color: var(--gold); font-weight: 600; }
.qr {
  flex-shrink: 0;
  width: 300px; height: 300px;
  background: #fff;
  border: 3px solid #E5D8C4;
  border-radius: 28px;
  padding: 26px;
}
.qr svg { width: 100%; height: 100%; }
</style></head>
<body>
<div class="slide">
  <div class="eyebrow">Presentes</div>
  <div class="headline">Pix direto, sem taxa</div>
  <div class="support">Nada de porcentagem descontada no caminho. O convidado presenteia e o valor chega em cheio para o casal.</div>
  <div class="mock">
    <div class="gift">
      <div class="name">Jantar dos noivos<br>em Gramado</div>
      <div class="price">R$ 250,00</div>
      <div class="btn">Presentear via Pix</div>
      <div class="note">100% para o casal</div>
    </div>
    <div class="qr">
      <svg viewBox="0 0 210 210" xmlns="http://www.w3.org/2000/svg" fill="#34211F">
        <g>
          <rect x="0" y="0" width="60" height="60" rx="10" fill="none" stroke="#34211F" stroke-width="12"/>
          <rect x="18" y="18" width="24" height="24" rx="4"/>
          <rect x="150" y="0" width="60" height="60" rx="10" fill="none" stroke="#34211F" stroke-width="12"/>
          <rect x="168" y="18" width="24" height="24" rx="4"/>
          <rect x="0" y="150" width="60" height="60" rx="10" fill="none" stroke="#34211F" stroke-width="12"/>
          <rect x="18" y="168" width="24" height="24" rx="4"/>
          <rect x="84" y="6" width="14" height="14"/><rect x="110" y="6" width="14" height="14"/>
          <rect x="84" y="32" width="14" height="14"/><rect x="122" y="32" width="14" height="14"/>
          <rect x="96" y="56" width="14" height="14"/><rect x="70" y="44" width="14" height="14"/>
          <rect x="6" y="84" width="14" height="14"/><rect x="32" y="96" width="14" height="14"/>
          <rect x="58" y="84" width="14" height="14"/><rect x="84" y="96" width="14" height="14"/>
          <rect x="110" y="84" width="14" height="14"/><rect x="136" y="96" width="14" height="14"/>
          <rect x="162" y="84" width="14" height="14"/><rect x="188" y="96" width="14" height="14"/>
          <rect x="6" y="122" width="14" height="14"/><rect x="58" y="110" width="14" height="14"/>
          <rect x="96" y="122" width="14" height="14"/><rect x="148" y="122" width="14" height="14"/>
          <rect x="188" y="110" width="14" height="14"/><rect x="32" y="122" width="14" height="14"/>
          <rect x="84" y="148" width="14" height="14"/><rect x="110" y="160" width="14" height="14"/>
          <rect x="136" y="148" width="14" height="14"/><rect x="162" y="160" width="14" height="14"/>
          <rect x="188" y="148" width="14" height="14"/><rect x="96" y="186" width="14" height="14"/>
          <rect x="122" y="186" width="14" height="14"/><rect x="148" y="174" width="14" height="14"/>
          <rect x="174" y="186" width="14" height="14"/>
        </g>
      </svg>
    </div>
  </div>
  <div class="footer">
    <span class="brand"><span class="frame-mark"></span>casamentos.app</span>
    <span class="dots"><span></span><span></span><span></span><span class="on"></span><span></span><span></span></span>
  </div>
</div>
</body></html>

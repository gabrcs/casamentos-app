<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<link rel="stylesheet" href="base.css">
<style>
body { background: var(--plum); }
.slide { align-items: center; justify-content: center; text-align: center; }
.mini-frame {
  width: 74px; height: 88px;
  border: 6px solid var(--gold);
  border-radius: 28px 10px 28px 10px;
  margin-bottom: 52px;
}
h1 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 600;
  font-size: 104px;
  line-height: 1.06;
  color: var(--ivory);
  letter-spacing: -0.01em;
}
h1 em { font-style: italic; color: #E9C08F; }
.cta {
  margin-top: 64px;
  background: var(--ivory);
  color: var(--plum);
  border-radius: 999px;
  padding: 32px 64px;
  font-size: 32px;
  font-weight: 600;
}
.hint { margin-top: 30px; font-size: 26px; color: rgba(251, 246, 238, 0.7); font-weight: 500; }
.brand-foot {
  position: absolute;
  bottom: 62px; left: 0; right: 0;
  text-align: center;
  font-size: 27px;
  font-weight: 500;
  color: rgba(251, 246, 238, 0.85);
  letter-spacing: 0.02em;
}
</style></head>
<body>
<div class="slide">
  <div class="mini-frame"></div>
  <h1>Veja a celebração<br>de vocês <em>online</em>.</h1>
  <div class="cta">Chama a gente no WhatsApp</div>
  <div class="hint">link na bio</div>
  <div class="brand-foot">casamentos.app · Curitiba e todo o Brasil</div>
</div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<link rel="stylesheet" href="base.css">
<style>
.mock {
  margin-top: 62px;
  width: 780px;
  height: 566px;
  align-self: center;
  padding: 74px 84px;
  display: flex;
  flex-direction: column;
}
.mock .title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 600;
  font-size: 54px;
  color: var(--plum);
}
.field {
  margin-top: 34px;
  border: 2px solid #E5D8C4;
  border-radius: 16px;
  padding: 24px 28px;
  font-size: 28px;
  color: var(--cocoa);
  background: #fff;
}
.field small { display: block; font-size: 20px; color: var(--gold); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
.btn-row { display: flex; gap: 22px; margin-top: 40px; }
.btn {
  border-radius: 999px;
  padding: 26px 44px;
  font-size: 28px;
  font-weight: 600;
}
.btn.yes { background: var(--plum); color: var(--ivory); }
.btn.no { border: 2px solid #D8C8B0; color: #8a7563; background: #fff; }
.check { color: #E9C08F; margin-right: 10px; }
</style></head>
<body>
<div class="slide">
  <div class="eyebrow">RSVP</div>
  <div class="headline">Convidados confirmam<br>em segundos</div>
  <div class="support">Sem grupo de WhatsApp lotado, sem planilha. Vocês acompanham as confirmações em tempo real.</div>
  <div class="mock">
    <div class="title">Confirme sua presença</div>
    <div class="field"><small>Seu nome</small>Ana Beatriz Souza</div>
    <div class="btn-row">
      <div class="btn yes"><span class="check">✓</span>Vou com alegria</div>
      <div class="btn no">Não poderei ir</div>
    </div>
  </div>
  <div class="footer">
    <span class="brand"><span class="frame-mark"></span>casamentos.app</span>
    <span class="dots"><span></span><span></span><span class="on"></span><span></span><span></span><span></span></span>
  </div>
</div>
</body></html>

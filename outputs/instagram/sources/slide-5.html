<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<link rel="stylesheet" href="base.css">
<style>
.mock {
  margin-top: 62px;
  width: 820px;
  height: 560px;
  align-self: center;
  padding: 66px 78px;
}
.mock .title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 600;
  font-size: 50px;
  color: var(--plum);
  margin-bottom: 40px;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 30px 0;
  border-bottom: 2px solid #EFE4D2;
  font-size: 29px;
}
.row:last-child { border-bottom: none; }
.row .label { display: flex; align-items: center; gap: 20px; color: var(--cocoa); font-weight: 500; }
.row .ico { width: 16px; height: 16px; border-radius: 50%; background: var(--gold); }
.row .val { font-weight: 600; color: var(--plum); font-size: 32px; }
.row .val small { font-weight: 400; color: #9b8672; font-size: 24px; }
</style></head>
<body>
<div class="slide">
  <div class="eyebrow">Painel do casal</div>
  <div class="headline">Tudo no lugar, sem<br>depender de ninguém</div>
  <div class="support">RSVP, presentes e recados num painel simples que vocês mesmos administram.</div>
  <div class="mock">
    <div class="title">Painel · Marcus &amp; Daíse</div>
    <div class="row">
      <span class="label"><span class="ico"></span>Presenças confirmadas</span>
      <span class="val">87 <small>de 120</small></span>
    </div>
    <div class="row">
      <span class="label"><span class="ico"></span>Presentes recebidos</span>
      <span class="val">R$ 3.450</span>
    </div>
    <div class="row">
      <span class="label"><span class="ico"></span>Recados dos convidados</span>
      <span class="val">23</span>
    </div>
  </div>
  <div class="footer">
    <span class="brand"><span class="frame-mark"></span>casamentos.app</span>
    <span class="dots"><span></span><span></span><span></span><span></span><span class="on"></span><span></span></span>
  </div>
</div>
</body></html>

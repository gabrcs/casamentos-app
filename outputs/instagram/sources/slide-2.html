<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<link rel="stylesheet" href="base.css">
<style>
.mock {
  margin-top: 62px;
  width: 896px;
  height: 566px;
  align-self: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: linear-gradient(180deg, #FFFDF8 0%, #F7EDDD 100%);
}
.mock .names {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 500;
  font-size: 96px;
  color: var(--plum);
  line-height: 1;
}
.mock .amp { font-style: italic; color: var(--gold); padding: 0 10px; }
.mock .date {
  margin-top: 26px;
  font-size: 26px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--cocoa);
}
.count { display: flex; gap: 20px; margin-top: 46px; }
.count div {
  background: var(--plum);
  color: var(--ivory);
  border-radius: 18px;
  width: 108px;
  padding: 18px 0 14px;
}
.count b { display: block; font-size: 40px; font-weight: 600; }
.count small { font-size: 18px; font-weight: 400; opacity: 0.75; letter-spacing: 0.08em; }
</style></head>
<body>
<div class="slide">
  <div class="eyebrow">Sob medida</div>
  <div class="headline">Feito ao redor da<br>história de vocês</div>
  <div class="support">Cores, palavras e fotos começam no casal. Nada de catálogo de modelos prontos.</div>
  <div class="mock">
    <div class="names">Marcus <span class="amp">&amp;</span> Daíse</div>
    <div class="date">21 · 11 · 2026 · Curitiba</div>
    <div class="count">
      <div><b>117</b><small>dias</small></div>
      <div><b>08</b><small>horas</small></div>
      <div><b>42</b><small>min</small></div>
      <div><b>19</b><small>seg</small></div>
    </div>
  </div>
  <div class="footer">
    <span class="brand"><span class="frame-mark"></span>casamentos.app</span>
    <span class="dots"><span></span><span class="on"></span><span></span><span></span><span></span><span></span></span>
  </div>
</div>
</body></html>

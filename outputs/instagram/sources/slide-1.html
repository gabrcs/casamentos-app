<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<link rel="stylesheet" href="base.css">
<style>
body { background: var(--plum); }
.slide { align-items: center; justify-content: center; text-align: center; }
.big-frame {
  border: 7px solid rgba(251, 246, 238, 0.92);
  border-radius: 240px 72px 240px 72px;
  padding: 130px 96px 120px;
  width: 896px;
  height: 800px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.eyebrow { color: var(--rose); }
h1 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 600;
  font-size: 112px;
  line-height: 1.05;
  color: var(--ivory);
  margin-top: 34px;
  letter-spacing: -0.01em;
}
h1 em { font-style: italic; color: #E9C08F; }
.keyline { width: 88px; height: 3px; background: var(--gold); margin: 44px auto 0; }
.sub {
  margin-top: 36px;
  font-size: 30px;
  font-weight: 500;
  color: rgba(251, 246, 238, 0.85);
  letter-spacing: 0.01em;
}
.swipe {
  position: absolute;
  bottom: 60px; left: 0; right: 0;
  text-align: center;
  font-size: 25px;
  font-weight: 500;
  color: rgba(251, 246, 238, 0.65);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
</style></head>
<body>
<div class="slide">
  <div class="big-frame">
    <div class="eyebrow">casamentos.app</div>
    <h1>Um site de casamento<br><em>inteiramente</em> de vocês.</h1>
    <div class="keyline"></div>
    <div class="sub">Sob medida &nbsp;·&nbsp; RSVP &nbsp;·&nbsp; Pix sem taxa</div>
  </div>
  <div class="swipe">arraste para conhecer</div>
</div>
</body></html>

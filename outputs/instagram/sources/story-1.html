<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<link rel="stylesheet" href="base.css">
<style>
body { width: 1080px; height: 1920px; background: var(--plum); }
.story {
  width: 1080px; height: 1920px;
  padding: 200px 100px 220px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
}
.brand-top {
  font-size: 30px;
  font-weight: 600;
  color: rgba(251, 246, 238, 0.9);
  letter-spacing: 0.04em;
}
.big-frame {
  margin-top: 110px;
  border: 7px solid rgba(251, 246, 238, 0.92);
  border-radius: 280px 84px 280px 84px;
  width: 880px;
  padding: 150px 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.eyebrow { color: var(--rose); font-size: 28px; }
h1 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 600;
  font-size: 116px;
  line-height: 1.07;
  color: var(--ivory);
  margin-top: 40px;
  letter-spacing: -0.01em;
}
h1 em { font-style: italic; color: #E9C08F; }
.keyline { width: 88px; height: 3px; background: var(--gold); margin: 52px auto 0; }
.facts {
  margin-top: 48px;
  font-size: 32px;
  font-weight: 500;
  color: rgba(251, 246, 238, 0.85);
}
.cta {
  margin-top: 130px;
  background: var(--ivory);
  color: var(--plum);
  border-radius: 999px;
  padding: 34px 70px;
  font-size: 34px;
  font-weight: 600;
}
.hint {
  margin-top: 34px;
  font-size: 28px;
  color: rgba(251, 246, 238, 0.65);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.mini-frame {
  width: 62px; height: 74px;
  border: 6px solid var(--gold);
  border-radius: 24px 9px 24px 9px;
  position: absolute;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
}
</style></head>
<body>
<div class="story">
  <div class="brand-top">casamentos.app</div>
  <div class="big-frame">
    <div class="eyebrow">Chegamos ao Instagram</div>
    <h1>O site do casamento, <em>inteiramente</em> de vocês.</h1>
    <div class="keyline"></div>
    <div class="facts">Sob medida · RSVP · Pix sem taxa</div>
  </div>
  <div class="cta">Conheça o primeiro casal no feed</div>
  <div class="hint">link na bio para falar com a gente</div>
  <div class="mini-frame"></div>
</div>
</body></html>
